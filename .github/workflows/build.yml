name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ZIG_VERSION: "0.15.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          name="zig-x86_64-linux-${ZIG_VERSION}"
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${name}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - run: zig version

      - name: Formatting
        run: zig fmt --check src build.zig

      - name: Unit tests
        run: zig build test

      - name: LuCI translation coverage
        run: python3 scripts/check-luci-i18n.py

      - name: Default build and smoke test
        run: |
          zig build -Doptimize=ReleaseSmall
          ./zig-out/bin/anytls-zig --version
          ./zig-out/bin/anytls-zig --help > /dev/null

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mipsel-musleabi
            target: mipsel-linux-musleabi
            cpu: mips32r2
            match: "LSB executable, MIPS"
            abi: mips
            owrt_arch: mipsel_24kc
          - name: mips-musleabi
            target: mips-linux-musleabi
            cpu: mips32r2
            match: "MSB executable, MIPS"
            abi: mips
            owrt_arch: mips_24kc
          - name: armv7-musleabihf
            target: arm-linux-musleabihf
            cpu: cortex_a7
            match: "ARM, EABI5"
            abi: ""
            owrt_arch: arm_cortex-a7_neon-vfpv4
          - name: aarch64-musl
            target: aarch64-linux-musl
            cpu: baseline
            match: "aarch64"
            abi: ""
            owrt_arch: aarch64_cortex-a53
          - name: x86_64-musl
            target: x86_64-linux-musl
            cpu: baseline
            match: "x86-64"
            abi: ""
            owrt_arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          name="zig-x86_64-linux-${ZIG_VERSION}"
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${name}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.name }}-${{ hashFiles('build.zig', 'src/**/*.zig') }}
          restore-keys: |
            zig-${{ env.ZIG_VERSION }}-${{ matrix.name }}-

      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.1.0"
          fi
          echo "app=$v" >> "$GITHUB_OUTPUT"
          echo "apk=$v-r1" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }}
        run: |
          zig build -Doptimize=ReleaseSmall \
            -Dtarget=${{ matrix.target }} \
            -Dcpu=${{ matrix.cpu }} \
            --prefix "out/${{ matrix.name }}"

      - name: Verify ELF
        run: |
          cp "out/${{ matrix.name }}/bin/anytls-zig" "out/anytls-zig-${{ matrix.name }}"
          chmod +x "out/anytls-zig-${{ matrix.name }}"
          scripts/check-elf.sh "out/anytls-zig-${{ matrix.name }}" \
            "${{ matrix.match }}" "${{ matrix.abi }}"
          sha256sum "out/anytls-zig-${{ matrix.name }}"

      - name: Package OpenWrt apk
        run: |
          scripts/make-apk.sh "out/anytls-zig-${{ matrix.name }}" \
            "${{ matrix.owrt_arch }}" "${{ steps.ver.outputs.apk }}" \
            "out/anytls-zig_${{ steps.ver.outputs.apk }}_${{ matrix.owrt_arch }}.apk"
          tar -tzf out/anytls-zig_*.apk | grep -qx '.PKGINFO'
          ls -l out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anytls-zig-${{ matrix.name }}
          path: |
            out/anytls-zig-${{ matrix.name }}
            out/anytls-zig_*.apk
          if-no-files-found: error

  luci:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.1.0"
          fi
          echo "apk=$v-r1" >> "$GITHUB_OUTPUT"

      - name: Build LuCI apk
        run: |
          mkdir -p out
          scripts/make-luci-apk.sh "${{ steps.ver.outputs.apk }}" \
            "out/luci-app-anytls-zig_${{ steps.ver.outputs.apk }}_all.apk"
          tar -tzf out/luci-app-anytls-zig_*.apk | grep -qx 'usr/lib/lua/luci/i18n/anytls-zig.zh_Hans.lmo'
          tar -tzf out/luci-app-anytls-zig_*.apk | grep -qx 'www/luci-static/resources/view/anytls-zig/settings.js'
          ls -l out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-anytls-zig
          path: out/luci-app-anytls-zig_*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, luci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum anytls-zig* luci-app-anytls-zig* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(release/anytls-zig* release/luci-app-anytls-zig* release/SHA256SUMS README.md README.zh-CN.md LICENSE)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${files[@]}"
          else
            gh release create "$tag" --title "anytls-zig $tag" --generate-notes "${files[@]}"
          fi
